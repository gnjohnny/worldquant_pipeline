simulation_defaults:
  region: "USA"
  universe: "TOP3000"
  delay: 1
  decay: 4
  neutralization: "SUBINDUSTRY"
  truncation: 0.0100
  paste_neutralization: "Subindustry"
  unit_handling: "verify"

quality_gates:
  min_sharpe: 1.25
  min_fitness: 1.50
  max_turnover: 0.70
  min_turnover: 0.01
  max_drawdown: 0.25
  max_correlation: 0.70

operators:
  # Time-series operators: [name, arity, description]
  time_series:
    - name: "ts_rank"
      arity: 2
      param_types: ["expression", "integer"]
      description: "Time-series rank over d days"
    - name: "ts_delay"
      arity: 2
      param_types: ["expression", "integer"]
      description: "Value delayed by d days"
    - name: "ts_delta"
      arity: 2
      param_types: ["expression", "integer"]
      description: "x - ts_delay(x, d)"
    - name: "decay_linear"
      arity: 2
      param_types: ["expression", "integer"]
      description: "Linear decay over d days"
    - name: "ts_decay_linear"
      arity: 2
      param_types: ["expression", "integer"]
      description: "Linearly weighted moving average over d days"
    - name: "ts_decay_exp_window"
      arity: 3
      param_types: ["expression", "integer", "number"]
      description: "Exponential decay moving average over d days with smoothing factor"
    - name: "ts_mean"
      arity: 2
      param_types: ["expression", "integer"]
      description: "Rolling average over d days"
    - name: "ts_std_dev"
      arity: 2
      param_types: ["expression", "integer"]
      description: "Rolling standard deviation over d days"
    - name: "ts_backfill"
      arity: 2
      param_types: ["expression", "integer"]
      description: "Backfill missing values with the last valid value over d days"
    - name: "ts_sum"
      arity: 2
      param_types: ["expression", "integer"]
      description: "Rolling sum over d days"
    - name: "ts_product"
      arity: 2
      param_types: ["expression", "integer"]
      description: "Rolling product over d days"
    - name: "ts_scale"
      arity: [2, 3]
      param_types: ["expression", "integer"]
      description: "Time-series min-max scale over d days: (x - ts_min(x, d)) / (ts_max(x, d) - ts_min(x, d))"
    - name: "ts_argmax"
      arity: 2
      param_types: ["expression", "integer"]
      description: "Day of time-series maximum over d days"
    - name: "ts_argmin"
      arity: 2
      param_types: ["expression", "integer"]
      description: "Day of time-series minimum over d days"
    - name: "ts_median"
      arity: 2
      param_types: ["expression", "integer"]
      description: "Rolling median over d days"
    - name: "ts_quantile"
      arity: 3
      param_types: ["expression", "integer", "number"]
      description: "Rolling quantile over d days"
    - name: "ts_kurtosis"
      arity: 2
      param_types: ["expression", "integer"]
      description: "Rolling kurtosis over d days"
    - name: "ts_zscore"
      arity: 2
      param_types: ["expression", "integer"]
      description: "Rolling z-score (x - ts_mean) / ts_std_dev over d days"
    - name: "ts_corr"
      arity: 3
      param_types: ["expression", "expression", "integer"]
      description: "Time-series correlation between x and y over d days"
    - name: "ts_covariance"
      arity: 3
      param_types: ["expression", "expression", "integer"]
      description: "Time-series covariance between x and y over d days"
    - name: "ts_regression"
      arity: [3, 4, 5]
      param_types: ["expression", "expression", "integer"]
      description: "Time-series linear regression of y on x over d days"
    - name: "inst_tvr"
      arity: 2
      param_types: ["expression", "integer"]
      description: "Instrument turnover over d days"

  # Cross-sectional & group operators
  cross_sectional:
    - name: "rank"
      arity: 1
      param_types: ["expression"]
      description: "Cross-sectional rank across the universe"
    - name: "group_rank"
      arity: 2
      param_types: ["expression", "group"]
      description: "Cross-sectional rank within a group (e.g. subindustry)"
    - name: "group_neutralize"
      arity: 2
      param_types: ["expression", "group"]
      description: "Neutralize expression relative to a group"
    - name: "group_zscore"
      arity: 2
      param_types: ["expression", "group"]
      description: "Cross-sectional z-score within a group"
    - name: "group_mean"
      arity: 2
      param_types: ["expression", "group"]
      description: "Cross-sectional mean within a group"
    - name: "group_median"
      arity: 2
      param_types: ["expression", "group"]
      description: "Cross-sectional median within a group"
    - name: "group_std_dev"
      arity: 2
      param_types: ["expression", "group"]
      description: "Cross-sectional standard deviation within a group"
    - name: "group_max"
      arity: 2
      param_types: ["expression", "group"]
      description: "Cross-sectional maximum within a group"
    - name: "group_min"
      arity: 2
      param_types: ["expression", "group"]
      description: "Cross-sectional minimum within a group"
    - name: "group_sum"
      arity: 2
      param_types: ["expression", "group"]
      description: "Cross-sectional sum within a group"
    - name: "group_scale"
      arity: 2
      param_types: ["expression", "group"]
      description: "Scale expression within each group"
    - name: "zscore"
      arity: 1
      param_types: ["expression"]
      description: "Cross-sectional z-score (x - mean) / std"
    - name: "normalize"
      arity: 1
      param_types: ["expression"]
      description: "Scale expression to sum(abs(x)) = 1"
    - name: "scale"
      arity: [1, 2]
      param_types: ["expression"]
      description: "Scale expression so sum(abs(x)) = scale_factor (default 1)"
    - name: "truncate"
      arity: 2
      param_types: ["expression", "number"]
      description: "Truncate individual weights to max_percent"
    - name: "winsorize"
      arity: 1
      param_types: ["expression"]
      description: "Winsorize outliers in expression"
    - name: "quantile"
      arity: [1, 2]
      param_types: ["expression"]
      description: "Cross-sectional quantile calculation"
    - name: "trade_when"
      arity: 3
      param_types: ["expression", "expression", "expression"]
      description: "Conditional holding: trade_when(condition, alpha, exit_alpha)"
    - name: "densify"
      arity: 1
      param_types: ["expression"]
      description: "Densifies sparse group indexes into contiguous active memory buckets"
    - name: "bucket"
      arity: 2
      param_types: ["expression", "string"]
      description: "Converts continuous float vector into discrete categorical buckets"
    - name: "vec_avg"
      arity: 1
      param_types: ["expression"]
      description: "Computes arithmetic mean across elements of a vector data field"
  # Math & transformations
  elementwise:
    - name: "log"
      arity: 1
      param_types: ["expression"]
      description: "Natural logarithm"
    - name: "exp"
      arity: 1
      param_types: ["expression"]
      description: "Exponential function e^x"
    - name: "sqrt"
      arity: 1
      param_types: ["expression"]
      description: "Square root"
    - name: "sign"
      arity: 1
      param_types: ["expression"]
      description: "Sign of x (-1, 0, 1)"
    - name: "abs"
      arity: 1
      param_types: ["expression"]
      description: "Absolute value"
    - name: "floor"
      arity: 1
      param_types: ["expression"]
      description: "Round down to nearest integer"
    - name: "ceil"
      arity: 1
      param_types: ["expression"]
      description: "Round up to nearest integer"
    - name: "round"
      arity: 1
      param_types: ["expression"]
      description: "Round to nearest integer"
    - name: "min"
      arity: 2
      param_types: ["expression", "expression"]
      description: "Elementwise minimum of x and y"
    - name: "max"
      arity: 2
      param_types: ["expression", "expression"]
      description: "Elementwise maximum of x and y"
    - name: "power"
      arity: 2
      param_types: ["expression", "number"]
      description: "x raised to power y"
    - name: "signed_power"
      arity: 2
      param_types: ["expression", "number"]
      description: "sign(x) * (abs(x) ** y)"
    - name: "sigmoid"
      arity: 1
      param_types: ["expression"]
      description: "Standard sigmoid 1 / (1 + exp(-x))"
    - name: "clamp"
      arity: 3
      param_types: ["expression", "number", "number"]
      description: "Clamp x between min_val and max_val"
